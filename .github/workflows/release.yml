name: Build & Release

on:
  push:
    branches:
      - main
      - v2
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Cache unpacked Paper test server
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/pluginhooker-paper
          key: paper-test-cache-26.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version and build
        id: build_step
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            CLEAN_VERSION="${RAW_TAG#v}"
            echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
            ./gradlew build -PpluginVersion="${CLEAN_VERSION}" --no-daemon
          else
            ./gradlew build --no-daemon
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PluginHooker-jars
          path: |
            hooker-core/build/libs/PluginHooker-*.jar
            hooker-api/build/libs/hooker-api-*.jar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hooker-core/build/libs/PluginHooker-${{ steps.build_step.outputs.version }}.jar
            hooker-api/build/libs/hooker-api-${{ steps.build_step.outputs.version }}.jar
            hooker-api/build/libs/hooker-api-${{ steps.build_step.outputs.version }}-sources.jar
