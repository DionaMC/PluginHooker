# Enable bStats metrics
bstats: true

# Global sandbox settings
sandbox:
  # Print debug logs when a hooked plugin's API action (kick, command, teleport, velocity, message) is intercepted
  debug: false
  # Default policy when a plugin is added to the sandbox:
  # WHITELIST: Disabled for all players by default unless enabled per player
  # BLACKLIST: Enabled for all players by default unless disabled per player
  default-mode: WHITELIST
  # Grace period (in ticks) after a player joins during which packets are allowed
  # so anticheats/plugins can initialize their internal PlayerData without errors.
  join-grace-ticks: 5
  # Plugins automatically registered into the sandbox on startup or when enabled.
  # Example:
  # plugins:
  #   GrimAC: WHITELIST
  #   Vulcan: BLACKLIST
  plugins: {}

# Hook modules
hook:
  bukkit:
    # Hook Bukkit RegisteredListener#callEvent
    enabled: true
    # Fire BukkitHookEvent before allowing a listener call
    call-event: false
    # Use ClassValue MethodHandle cache to extract Player from custom/unknown events
    use-reflection-to-get-event-player: true

  bukkit-api:
    # Hook CraftServer, CraftWorld, CraftPlayer, and CraftEntity APIs
    enabled: true
    # Filter Bukkit.getOnlinePlayers() / Server#getOnlinePlayers() / Server#matchPlayer()
    hide-from-online-players: false
    # Filter World#getPlayers()
    hide-from-world-players: false
    # Filter Bukkit.getPlayer(...) / Bukkit.getPlayerExact(...)
    hide-from-get-player: false
    # Filter World#getEntities(), getLivingEntities(), getEntitiesByClass(), and getNearbyEntities()
    hide-from-entity-lists: false
    # Block disabled plugins from kicking players via Player#kickPlayer
    block-disabled-kick: true
    # Fire PlayerKickHookEvent when a hooked plugin calls Player#kickPlayer
    call-kick-event: true
    # Block disabled plugins from executing commands targeting disabled players via Server#dispatchCommand
    block-disabled-dispatch-command: true
    # Fire PluginDispatchCommandEvent when a hooked plugin calls Server#dispatchCommand
    call-dispatch-command-event: true
    # Block disabled plugins from teleporting players via Player#teleport
    block-disabled-teleport: true
    # Block disabled plugins from modifying player velocity via Player#setVelocity
    block-disabled-velocity: true
    # Block disabled plugins from sending messages, action bars, titles, or broadcasts to disabled players
    block-disabled-send-message: true
    # Block disabled plugins from closing open inventories on disabled players via HumanEntity#closeInventory
    block-disabled-close-inventory: true

  protocollib:
    # Hook ProtocolLib InboundPacketListenerSet & OutboundPacketListenerSet
    enabled: true
    # Fire ProtocolLibHookEvent
    call-event: false

  netty:
    # Hook Netty DefaultChannelPipeline & AbstractChannelHandlerContext
    enabled: true
    # Fire NettyHookEvent
    call-event: false

  packetevents:
    # Hook PacketEvents EventManager, PacketReceiveEvent & PacketSendEvent (standalone & shaded)
    enabled: true
    # Fire PacketEventsHookEvent
    call-event: false
